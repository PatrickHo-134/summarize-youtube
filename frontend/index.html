<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
     <title>YouTube Summarizer</title>
     <style>
          body {
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
               max-width: 750px;
               margin: 50px auto;
               padding: 20px;
               color: #333;
               line-height: 1.6;
          }

          h1 {
               font-size: 1.8rem;
               margin-bottom: 20px;
          }

          h2 {
               margin-top: 0px;
               margin-bottom: 10px;
          }

          h3 {
               margin-top: 0px;
               margin-bottom: 0px;
          }

          .input-group {
               display: flex;
               gap: 10px;
               margin-bottom: 20px;
          }

          input[type="text"] {
               flex: 1;
               padding: 12px;
               font-size: 15px;
               border: 1px solid #ccc;
               border-radius: 6px;
               outline: none;
          }

          input[type="text"]:focus {
               border-color: #0066cc;
          }

          button {
               padding: 12px 20px;
               font-size: 15px;
               font-weight: 600;
               background-color: #0066cc;
               color: white;
               border: none;
               border-radius: 6px;
               cursor: pointer;
               transition: background 0.2s;
          }

          button:hover {
               background-color: #0052a3;
          }

          button:disabled {
               background-color: #a0c4e8;
               cursor: not-allowed;
          }

          .spinner {
               display: none;
               margin: 20px 0;
               font-style: italic;
               color: #666;
          }

          #result {
               display: none;
               margin-top: 10px;
               padding: 20px;
               background-color: #f8f9fa;
               border: 1px solid #e9ecef;
               border-radius: 8px;
               white-space: pre-wrap;
               line-height: 1.1;
          }

          #result ul {
               padding-left: 20px;
          }

          #result strong {
               color: #0052a3;
          }

          .action-container {
               display: none;
               gap: 10px;
               margin-top: 15px;
          }

          .btn-secondary {
               background-color: #28a745;
          }

          .btn-secondary:hover {
               background-color: #218838;
          }

          .btn-retry {
               background-color: #d9534f;
          }

          .btn-retry:hover {
               background-color: #c9302c;
          }

          .error {
               color: #d9534f;
               background-color: #fdf7f7;
               border-color: #f5c6cb;
          }
     </style>
</head>

<body>

     <h1>YouTube Video Summarizer</h1>

     <div class="input-group">
          <input type="text" id="urlInput"
               placeholder="Paste YouTube URL here (e.g. https://www.youtube.com/watch?v=...)">
          <button id="submitBtn" onclick="summarizeVideo()">Summarize</button>
     </div>

     <div id="spinner" class="spinner">Fetching transcript and generating summary...</div>
     <div id="result"></div>

     <div id="actionContainer" class="action-container">
          <button id="emailBtn" class="btn-secondary" onclick="sendEmail()">✉️ Email Summary</button>
          <button id="retryBtn" class="btn-retry" onclick="summarizeVideo()">🔄 Retry Request</button>
     </div>

     <script>
          const API_ENDPOINT = 'https://etx5b18bqf.execute-api.ap-southeast-2.amazonaws.com/prod/summarize'; //[cite: 1]
          let currentSummaryText = "";

          async function summarizeVideo() {
               const urlInput = document.getElementById('urlInput');
               const submitBtn = document.getElementById('submitBtn');
               const spinner = document.getElementById('spinner');
               const resultDiv = document.getElementById('result');
               const actionContainer = document.getElementById('actionContainer');
               const emailBtn = document.getElementById('emailBtn');
               const retryBtn = document.getElementById('retryBtn');

               const youtubeUrl = urlInput.value.trim();
               if (!youtubeUrl) return alert("Please enter a YouTube URL.");

               submitBtn.disabled = true;
               spinner.style.display = 'block';
               resultDiv.style.display = 'none';
               actionContainer.style.display = 'none';
               resultDiv.classList.remove('error');

               try {
                    const response = await fetch(API_ENDPOINT, {
                         method: 'POST',
                         headers: { 'Content-Type': 'application/json' },
                         body: JSON.stringify({ url: youtubeUrl })
                    });

                    const data = await response.json();

                    if (response.ok) {
                         currentSummaryText = data.summary;
                         resultDiv.innerHTML = marked.parse(data.summary); // Renders Markdown

                         actionContainer.style.display = 'flex';
                         emailBtn.style.display = 'block';
                         retryBtn.style.display = 'none';
                    } else {
                         throw new Error(data.error || 'Failed to summarize video.');
                    }
               } catch (err) {
                    resultDiv.classList.add('error');
                    resultDiv.textContent = `Error: ${err.message}`;

                    actionContainer.style.display = 'flex';
                    emailBtn.style.display = 'none';
                    retryBtn.style.display = 'block'; // Show retry on failure
               } finally {
                    submitBtn.disabled = false;
                    spinner.style.display = 'none';
                    resultDiv.style.display = 'block';
               }
          }

          function sendEmail() {
               // Client-side email triggering (can be replaced with an API call later)
               const subject = encodeURIComponent("YouTube Video Summary");
               const body = encodeURIComponent("Here is the summary of the video:\n\n" + currentSummaryText);
               window.location.href = `mailto:?subject=${subject}&body=${body}`;
          }
     </script>
</body>

</html>
